name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'docs/**'
      - 'packages/react/src/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'docs/**'

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build docs
        working-directory: apps/docs
        run: bun run build
