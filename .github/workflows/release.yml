name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only — skip git push and npm publish'
        type: boolean
        default: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - run: bun install --frozen-lockfile

      - name: Configure git for bot pushes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply pending changesets
        run: bun run version-packages

      - name: Show version bump preview (dry run)
        if: github.event.inputs.dry_run == 'true'
        run: |
          if git diff --quiet; then
            echo "::notice::No version changes — nothing would be released."
          else
            echo "::notice::DRY RUN — these are the changes that would be committed:"
            git status --short
            echo ""
            git diff --stat
          fi

      - name: Commit and push version bump (if any)
        if: github.event.inputs.dry_run != 'true'
        run: |
          if git diff --quiet; then
            echo "No version changes — nothing to release."
            exit 0
          fi
          git add .
          git commit -m "chore: release [skip ci]"
          git push origin HEAD:main

      - name: Build library
        run: bun run build

      - name: Publish to npm
        if: github.event.inputs.dry_run != 'true'
        run: bunx changeset publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish skipped (dry run)
        if: github.event.inputs.dry_run == 'true'
        run: echo "::notice::DRY RUN — skipped 'bunx changeset publish'."
